name: Release Drafter

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

jobs:
  draft-release:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@5de93583980a40bd78603b6dfdcda5b4df377b32 # v7.2.0
        with:
          commitish: ${{ github.sha }}
          latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
